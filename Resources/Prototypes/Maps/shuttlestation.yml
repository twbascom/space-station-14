- type: gameMap
  id: ShuttleStation
  mapName: 'Shuttle Station'
  mapPath: /Maps/shuttlestation.yml
  minPlayers: 0
  maxPlayers: 100
  fallback: true
  stations:
    ShuttleStation:
      stationProto: StandardNanotrasenStation
      components:
        - type: StationNameSetup
          mapNameTemplate: '{0} Shuttle Station {1}'
          nameGenerator:
            !type:NanotrasenNameGenerator
            prefixCreator: '14'
        - type: StationJobs
          availableJobs:
            Captain: [ 1, 1 ]
            HeadOfPersonnel: [ 1, 1 ]
            HeadOfSecurity: [ 1, 1 ]
            ChiefMedicalOfficer: [ 1, 1 ]
            ChiefEngineer: [ 1, 1 ]
            ResearchDirector: [ 1, 1 ]
            Quartermaster: [ 1, 1 ]
            Passenger: [ -1, -1 ]
