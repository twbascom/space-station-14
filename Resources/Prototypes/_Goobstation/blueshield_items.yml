- type: entity
  parent: ClothingUniformBase
  id: ClothingUniformEnvirosuitBlueshield
  name: Blueshield environmental suit
  description: An environmental suit tailored for Blueshield Officers.
  components:
  - type: Sprite
    sprite: _Goobstation/Clothing/Under/blueshield_officer.rsi
  - type: Clothing
    sprite: _Goobstation/Clothing/Under/blueshield_officer.rsi

- type: entity
  parent: ClothingHeadBase
  id: ClothingHeadEnvirohelmBlueshield
  name: Blueshield environmental helmet
  description: An environmental helmet tailored for Blueshield Officers.
  components:
  - type: Sprite
    sprite: _Goobstation/Clothing/Head/blueshield_beret.rsi
  - type: Clothing
    sprite: _Goobstation/Clothing/Head/blueshield_beret.rsi

- type: entity
  parent: ClothingBackpackSatchel
  id: ClothingBackpackMessengerBlueshield
  name: Blueshield messenger bag
  description: A messenger bag for easy access.
  components:
  - type: Sprite
    sprite: _Goobstation/Clothing/Back/blueshield_satchel.rsi
  - type: Clothing
    sprite: _Goobstation/Clothing/Back/blueshield_satchel.rsi

- type: entity
  parent: BasePDA
  id: BlueshieldPDA
  name: Blueshield PDA
  description: A command-blue personal digital assistant.
  components:
  - type: Sprite
    sprite: _Goobstation/Objects/Devices/blueshieldundetermined.rsi
    layers:
    - map: [ "enum.PdaVisualLayers.Base" ]
      state: icon
    - sprite: Objects/Devices/pda.rsi
      state: light_overlay
      map: [ "enum.PdaVisualLayers.Flashlight" ]
      shader: "unshaded"
      visible: false
    - sprite: Objects/Devices/pda.rsi
      state: id_overlay
      map: [ "enum.PdaVisualLayers.IdLight" ]
      shader: "unshaded"
      visible: false
  - type: Icon
    sprite: _Goobstation/Objects/Devices/blueshieldundetermined.rsi
    state: icon
  - type: Appearance
    appearanceDataInit:
      enum.PdaVisuals.PdaType:
        !type:String
        icon
  - type: Pda
    id: BlueshieldIDCard
    defaultCartridge: NotekeeperCartridge

- type: entity
  parent: TelescopicShield
  id: BlueShieldShield
  name: Blueshield shield
  description: An advanced collapsible shield issued to Blueshield Officers.
  components:
  - type: Sprite
    sprite: _Goobstation/Objects/Weapons/Melee/blueshieldshield.rsi
    layers:
      - state: icon
      - state: icon-on
        visible: false
        map: [ "shield" ]
  - type: Item
    sprite: _Goobstation/Objects/Weapons/Melee/blueshieldshield.rsi
    heldPrefix: ""
  - type: ToggleableVisuals
    inhandVisuals:
      left:
        - state: inhand-left-on
      right:
        - state: inhand-right-on

- type: entity
  parent: BlueShieldShield
  id: BlueShieldShieldEvil
  name: evil Blueshield shield
  suffix: Evil
  description: An advanced collapsible shield in Syndicate colors.

- type: entity
  parent: BaseItem
  id: UniqueBlueshieldOfficerLockerTeleporter
  name: Blueshield locker teleporter
  description: Pocket device that allows quick access to your locker items.
  components:
  - type: Sprite
    sprite: _Goobstation/Clothing/Belt/blueshield.rsi
    state: closed
  - type: SpawnItemsOnUse
    items:
    - id: LockerBlueshieldOfficerFilled
    sound: /Audio/Effects/teleport_arrival.ogg

- type: entity
  parent: ClothingHandsGlovesCombat
  id: ClothingHandsGlovesEnviroglovesCombat
  name: combat environmental gloves
  description: Combat gloves designed for use in hazardous environments.

- type: entity
  parent: FoodSnackSwirlLollipop
  id: FoodSnackLollypopBlueshield
  name: Blueshield lollypop
  description: A sweet blue lollypop to keep you calm during guards.

- type: entity
  parent: IDCardStandard
  id: BlueshieldIDCard
  name: Blueshield Officer ID card
  components:
  - type: Sprite
    layers:
    - state: gold
    - state: stripe_top
      color: "#004B7A"
    - state: stripe_bottom
      color: "#002F4D"
    - sprite: Interface/Misc/job_icons.rsi
      offset: -0.09375, 0.0625
      state: BlueshieldOfficer
  - type: PresetIdCard
    job: BlueshieldOfficer

- type: entity
  parent: BaseHypospray
  id: ParamedHypo
  name: paramedic hypospray
  description: A sterile injector for rapid administration of drugs to patients. Specialized for paramedic use.
  components:
  - type: Sprite
    sprite: Objects/Specific/Medical/hypospray.rsi
    layers:
    - state: hypo
      map: ["enum.SolutionContainerLayers.Base"]
    - state: hypo_fill1
      map: ["enum.SolutionContainerLayers.Fill"]
      visible: false
  - type: Item
    sprite: Objects/Specific/Medical/hypospray.rsi
  - type: SolutionContainerManager
    solutions:
      hypospray:
        maxVol: 30
  - type: RefillableSolution
    solution: hypospray
  - type: SolutionContainerVisuals
    maxFillLevels: 6
    fillBaseName: hypo_fill
    solutionName: hypospray
  - type: UseDelay
    delay: 0.5

- type: entity
  parent: MedkitCombat
  id: MedkitBSOFilled
  name: Blueshield Officer medical kit
  suffix: Filled
  components:
  - type: Sprite
    sprite: _Goobstation/Objects/Specific/Medical/firstaidkits.rsi
    state: bsokit
  - type: Item
    sprite: _Goobstation/Objects/Specific/Medical/firstaidkits.rsi
    heldPrefix: bsokit
  - type: Storage
    maxItemSize: Small
    grid:
    - 0,0,4,2
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        - id: Brutepack
          amount: 2
        - id: Ointment
          amount: 2
        - id: Gauze
          amount: 2
        - id: EmergencyMedipen
          amount: 2

- type: entity
  parent: Medkit
  id: MedkitBSOIPCFilled
  name: Blueshield Officer IPC repair kit
  suffix: Filled
  components:
  - type: Sprite
    sprite: _Goobstation/Objects/Specific/Medical/firstaidkits.rsi
    state: bsokit-ipc
  - type: Item
    sprite: _Goobstation/Objects/Specific/Medical/firstaidkits.rsi
    heldPrefix: bsokit-ipc
  - type: Storage
    maxItemSize: Normal
    grid:
    - 0,0,4,2
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        - id: ClothingHeadHatWelding
        - id: WelderExperimental
        - id: Screwdriver
        - id: Wirecutter
        - id: Multitool

- type: entity
  parent: Lighter
  id: FlippoLighterBlueshield
  name: Blueshield lighter
  description: A snazzy engraved lighter for Blueshield Officers.

- type: entity
  parent: CigPackGreen
  id: CigPackBlueshield
  name: Blueshield cigarettes
  description: A pack of premium blue-wrapped cigarettes.

- type: entity
