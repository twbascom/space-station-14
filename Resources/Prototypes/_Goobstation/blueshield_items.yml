    sprite: _Goobstation/Objects/Specific/Security/blueshieldundetermined.rsi
  - type: HardsuitPackage

- type: entity
  parent: [ClothingOuterHardsuitBase, BaseCentcommContraband]
  id: ClothingOuterHardsuitBSOHeavy
  name: BSO hardsuit heavy
  description: A heavy-duty environmental hardsuit tailored for Blueshield Officers. Offers supreme armor protection at the cost of mobility.
  components:
  - type: Sprite
    sprite: _Goobstation/Clothing/Hardsuits/BSO heavy.rsi
  - type: Clothing
    sprite: _Goobstation/Clothing/Hardsuits/BSO heavy.rsi
  - type: PressureProtection
    highPressureMultiplier: 0.1
    lowPressureMultiplier: 1000
  - type: ExplosionResistance
    damageCoefficient: 0.3
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.5
        Slash: 0.5
        Piercing: 0.5
        Heat: 0.6
        Caustic: 0.6
  - type: ClothingSpeedModifier
    walkModifier: 0.7
    sprintModifier: 0.7
  - type: HeldSpeedModifier
  - type: ToggleableClothing
    clothingPrototype: ClothingHeadHelmetHardsuitBlueshield
  - type: Tag
    tags:
    - CorgiWearable
    - Hardsuit
    - WhitelistChameleon
  - type: SpeciesRestrictClothing
    allowedSpecies:
    - Human
    - Vox

- type: entity
  parent: [ClothingOuterHardsuitBase, BaseCentcommContraband]
