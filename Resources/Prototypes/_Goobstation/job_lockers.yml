# Base Locker Entities
- type: entity
  id: LockerBlueshieldOfficer
  name: Blueshield Officer's locker
  parent: LockerBaseSecure
  components:
  - type: Appearance
  - type: Sprite
    sprite: _Goobstation/Structures/Storage/closet.rsi
  - type: AccessReader
    access: [["Command"]]
  - type: EntityStorageVisuals
    stateBaseClosed: bso
    stateDoorOpen: bso_open
    stateDoorClosed: bso_door

- type: entity
  id: LockerNanorep
  name: NanoTrasen Representative's locker
  parent: LockerBaseSecure
  components:
  - type: Appearance
  - type: Sprite
    sprite: _Goobstation/Structures/Storage/closet.rsi
  - type: AccessReader
    access: [["Command"]] # Nanorep has command access
  - type: EntityStorageVisuals
    stateBaseClosed: ntr
    stateDoorOpen: ntr_open
    stateDoorClosed: ntr_door

# Locker Fill and Filled Entities
- type: entityTable
  id: LockerFillNanorep
  table: !type:AllSelector
    children:
    - id: BoxFolderCentCom
    # - id: WeaponDisablerAdvanced
    - id: BedsheetCentcom
    # - id: CaneSheathFilledNanotrasen
    # - id: HandheldFaxOfficial
    # - id: RubberStampNanorep
    # - id: ExecutiveBriefcaseEmpty # nanorep update
    # - id: ComputerNTRTasksFlatpack # nanorep update
    - id: Paper
      amount: !type:ConstantNumberSelector
        value: 5
    # - id: NanoRepStationReport # Goobstation
    - id: DefibrillatorCompact
    - id: ParamedHypo
    - id: MedkitBSOFilled
    - id: MedkitBSOIPCFilled
    - id: FlippoLighterBlueshield
    - id: CigPackBlueshield
    - id: BoxZiptie
    - id: OxygenTankFilled
    - id: NitrogenTankFilled
    - id: OmnimedTool
    - id: ClothingBackpackDuffelSurgeryFilled
    - id: HandheldCrewMonitorBSO
    - id: BlueshieldUndeterminedWeapon
    - id: BlueshieldUndeterminedHardsuit
    - id: FlashlightSeclite

- type: entity
  id: LockerNanorepFilled
  suffix: Filled
  parent: LockerNanorep
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:NestedSelector
        tableId: LockerFillNanorep

- type: entityTable
  id: LockerFillBlueshieldOfficer
  table: !type:AllSelector
    children:
    - id: DefibrillatorCompact
    - id: ParamedHypo
    - id: MedkitBSOFilled
    - id: MedkitBSOIPCFilled
    - id: FlippoLighterBlueshield
    - id: CigPackBlueshield
    - id: BoxZiptie
    - id: OxygenTankFilled
    - id: NitrogenTankFilled
    - id: OmnimedTool
    - id: ClothingBackpackDuffelSurgeryFilled
    - id: HandheldCrewMonitorBSO
    - id: BlueshieldUndeterminedWeapon
    - id: WeaponSubMachineGunBSO
    - id: MagazinePistolSubMachineGun
      amount: !type:ConstantNumberSelector
        value: 5
    - id: BlueshieldUndeterminedHardsuit
    - id: FlashlightSeclite

- type: entity
  id: LockerBlueshieldOfficerFilled
  suffix: Filled
  parent: LockerBlueshieldOfficer
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:NestedSelector
        tableId: LockerFillBlueshieldOfficer
