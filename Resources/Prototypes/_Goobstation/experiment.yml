- type: entity
  parent: BaseAction
  id: ActionBark
  name: Bark
  description: Bark like a dog!
  components:
  - type: Action
    useDelay: 2
    icon: Interface/Actions/scream.png
    checkCanInteract: false
  - type: InstantAction
    event: !type:BarkActionEvent
  - type: EmoteOnAction
    emoteId: Bark

- type: emoteSounds
  id: ExperimentSounds
  params:
    variation: 0.125
  sounds:
    Laugh:
      collection: MaleLaugh
    Sneeze:
      collection: MaleSneezes
    Cough:
      collection: MaleCoughs
    Whistle:
      collection: Whistles
    Sigh:
      collection: MaleSigh
    Scream:
      collection: VulpkaninScreams
    Growl:
      collection: VulpkaninGrowls
    Snarl:
      collection: VulpkaninSnarls
    Bark:
      path: /Audio/_Goobstation/Mobs/arf.ogg
    Whine:
      collection: VulpkaninWhines
    Crying:
      collection: VulpkaninWhines
    Howl:
      collection: VulpkaninHowls
    Weh:
      collection: Weh
    Hew:
      collection: Hew
    Honk:
      collection: BikeHorn
    Gasp:
      collection: MaleGasp
    DefaultDeathgasp:
      collection: MaleDeathGasp

- type: entity
  parent: [SimpleMobBase, MobCombat]
  id: MobExperiment
  name: experiment
  description: A humanoid dog experiment. Looks dangerous yet neutral.
  suffix: Admin
  components:
  - type: Sprite
    drawdepth: Mobs
    sprite: _Goobstation/Mobs/experiment.rsi
    layers:
    - map: ["enum.DamageStateVisualLayers.Base"]
      state: corgi
  - type: DamageStateVisuals
    states:
      Alive:
        Base: corgi
      Critical:
        Base: corgi_dead
      Dead:
        Base: corgi_dead
  - type: MeleeWeapon
    soundHit:
      path: /Audio/Effects/bite.ogg
    angle: 0
    animation: WeaponArcBite
    damage:
      types:
        Piercing: 12
        Slash: 12
  - type: NPCRetaliation
    attackMemoryLength: 10
  - type: FactionException
  - type: NpcFactionMember
    factions:
    - SimpleNeutral
  - type: HTN
    rootTask:
      task: SimpleHostileCompound
  - type: Vocal
    sounds:
      Male: ExperimentSounds
      Female: ExperimentSounds
      Unsexed: ExperimentSounds
  - type: MobThresholds
    thresholds:
      0: Alive
      200: Dead
  - type: ActionGrant
    actions:
    - ActionBark
