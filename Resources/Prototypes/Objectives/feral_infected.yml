- type: entity
  abstract: true
  parent: BaseObjective
  id: BaseFeralInfectedObjective
  components:
  - type: Objective
    issuer: objective-issuer-feral-infected
  - type: RoleRequirement
    roles:
    - FeralInfectedRole

- type: entity
  parent: [BaseFeralInfectedObjective, BaseKillObjective]
  id: FeralInfectedKillObjective
  description: Tearing them apart is the only way to satisfy the hunger. Ensure they do not leave the station alive.
  components:
  - type: Objective
    difficulty: 2.0
    unique: false
  - type: TargetObjective
    title: objective-condition-maroon-person-title
  - type: PickRandomPerson
    filters:
    - !type:TargetObjectiveMindFilter
      blacklist:
        components:
        - KillPersonCondition
  - type: KillPersonCondition
    requireMaroon: true

- type: entity
  parent: [BaseFeralInfectedObjective, BaseKillObjective]
  id: FeralInfectedKillHeadObjective
  description: Eliminating the leadership will throw the station into chaos. Cut their throat.
  components:
  - type: Objective
    difficulty: 3.5
    unique: true
  - type: TargetObjective
    title: objective-condition-kill-maroon-title
  - type: PickRandomPerson
    filters:
    - !type:BodyMindFilter
      whitelist:
        components:
        - CommandStaff
    - !type:TargetObjectiveMindFilter
      blacklist:
        components:
        - KillPersonCondition
  - type: KillPersonCondition
    requireDead: true
    requireMaroon: true

- type: entity
  parent: [BaseFeralInfectedObjective, BaseLivingObjective]
  id: FeralInfectedEscapeObjective
  name: Escape to CentComm alive and unrestrained via the escape shuttle.
  description: Slip away onto the escape shuttle unnoticed. Ensure you survive.
  components:
  - type: Objective
    difficulty: 1.5
    icon:
      sprite: Structures/Furniture/chairs.rsi
      state: shuttle
  - type: EscapeShuttleCondition
