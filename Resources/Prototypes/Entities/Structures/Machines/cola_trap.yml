- type: entity
  parent: VendingMachineCola
  id: VendingMachineColaTrapped
  name: Robust Softdrinks
  description: A softdrink vendor provided by Robust Industries, LLC. Something feels slightly off about it...
  components:
  - type: TrappedVendingMachine
    dispenseDelay: 5
    dispenseChance: 0.10
    extraItemStock: 1
    extraItemPrototype: DrinkGoldenColaCan
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 500
      behaviors:
      - !type:DoActsBehavior
        acts: ["Breakage"]
      - !type:EjectVendorItems
    - trigger:
        !type:DamageTrigger
        damage: 600
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetSteel1:
            min: 1
            max: 1
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalGlassBreak
