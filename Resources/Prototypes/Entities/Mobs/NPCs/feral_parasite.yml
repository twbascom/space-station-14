- type: entity
  name: feral parasite
  parent:
  - BaseSimpleMob
  - MobCombat
  - MobBloodstream
  - MobFlammable
  id: MobFeralParasite
  description: A grotesque, skittering parasite creature. The final mutated state of the silent virus.
  components:
  - type: FeralInfected
    ascended: true
  - type: Sprite
    drawdepth: Mobs
    layers:
    - map: ["enum.DamageStateVisualLayers.Base"]
      state: alive
      sprite: Mobs/Aliens/Xenos/spacetick.rsi
      scale: 0.8, 0.8
  - type: DamageStateVisuals
    states:
      Alive:
        Base: alive
      Critical:
        Base: dead
      Dead:
        Base: dead
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.20
        density: 120
        mask:
        - SmallMobMask
        layer:
        - SmallMobLayer
  - type: MovementSpeedModifier
    baseWalkSpeed: 5.5
    baseSprintSpeed: 7.5
  - type: MeleeWeapon
    soundHit:
      collection: AlienClaw
    animation: WeaponArcClaw
    wideAnimation: WeaponArcClaw
    damage:
      types:
        Slash: 30
        Piercing: 20
  - type: Bloodstream
    bloodReferenceSolution:
      reagents:
      - ReagentId: Blood
        Quantity: 200
  - type: MobThresholds
    thresholds:
      0: Alive
      150: Critical
      250: Dead
  - type: Prying
    pryPowered: true
    speedModifier: 2.0
  - type: Climbing
  - type: Input
    context: "human"

- type: polymorph
  id: FeralParasitePolymorph
  configuration:
    entity: MobFeralParasite
    forced: true
    inventory: Drop
    ignoreAllowRepeatedMorphs: true
