- type: entity
  name: infected claws
  parent: BaseItem
  id: InfectedClaws
  description: Biological claws protruding from your hands. There is no way to remove them.
  components:
  - type: Sharp
  - type: FeralClaws
  - type: Sprite
    sprite: Objects/Weapons/Melee/claws.rsi
    state: icon
  - type: MeleeWeapon
    soundHit:
      collection: AlienClaw
    animation: WeaponArcClaw
    wideAnimation: WeaponArcClaw
    wideAnimationRotation: 90
    attackRate: 1.2
    damage:
      types:
        Slash: 15
        Piercing: 10
  - type: Item
    size: Normal
    sprite: Objects/Weapons/Melee/claws.rsi
  - type: Prying
    speedModifier: 1.5
    pryPowered: true
  - type: Unremoveable
    DeleteOnDrop: true

- type: entity
  name: mutated claws
  parent: InfectedClaws
  id: AscendedClaws
  description: Grotesque, fully mutated biological blades protruding from your hands. They look like they could slice through bulkheads.
  components:
  - type: FeralClaws
    ascended: true
  - type: MeleeWeapon
    soundHit:
      collection: AlienClaw
    animation: WeaponArcClaw
    wideAnimation: WeaponArcClaw
    wideAnimationRotation: 90
    attackRate: 1.8
    damage:
      types:
        Slash: 25
        Piercing: 15
  - type: Prying
    speedModifier: 2.0
    pryPowered: true
